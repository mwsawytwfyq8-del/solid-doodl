<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7e0d0d"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>ممالك الحديد</title><meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e9d6;--card:#fff8e8;--ink:#2b1d12;--mut:#7a6648;--line:#d8c6a0;--gold:#b45f06;--btn:#e8590c;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14100d;--card:#241b15;--ink:#f3e6cf;--mut:#a89270;--line:#45342a;--gold:#ffb020;--btn:#f0600c;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14100d;--card:#241b15;--ink:#f3e6cf;--mut:#a89270;--line:#45342a;--gold:#ffb020;--btn:#f0600c;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#top{display:flex;flex-wrap:wrap;gap:4px 10px;padding:8px 10px;background:var(--card);border-bottom:3px solid var(--btn);font-size:14px;justify-content:center}#top b{color:var(--gold)}
#main{flex:1;overflow:auto;padding:10px;max-width:640px;width:100%;margin:0 auto}h2{margin:6px 0 10px;font-size:18px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--btn);border-radius:10px;padding:10px;margin-bottom:8px}.card.lk{opacity:.5}
.ic{font-size:30px;width:42px;text-align:center}.in{flex:1;display:flex;flex-direction:column;gap:2px}.in small{color:var(--mut);font-size:12px}
button{font-family:inherit;font-weight:900;background:var(--btn);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}button:disabled{opacity:.4}button.alt{background:var(--mut)}
.chip{display:inline-block;margin-inline-end:6px;font-size:12px}.chip.x{color:var(--bad)}
#scene{background:linear-gradient(var(--card),var(--line));border-radius:12px;padding:12px;margin-bottom:10px;font-size:28px;line-height:1.5;text-align:center;min-height:80px}
#nav{display:flex;border-top:2px solid var(--line);background:var(--card)}#nav button{flex:1;border-radius:0;background:none;color:var(--mut);padding:12px 4px}#nav button.on{color:var(--gold);box-shadow:inset 0 3px var(--btn)}
#ts{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#g{position:fixed;inset:0;background:#000;display:none;z-index:50;touch-action:none}#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#st{position:absolute;top:0;height:env(safe-area-inset-top,0px);visibility:hidden}
#g button{position:absolute;border-radius:50%;background:#0007;border:2px solid #fff8;color:#fff;padding:0;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#bf{right:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:96px;height:96px;font-size:40px;background:#e8590ccc;border-color:#ffd9a0}
#bts button{position:static;width:54px;height:54px;font-size:22px}#bts button small{font-size:9px;margin-top:2px}
#bts{position:absolute;right:14px;bottom:calc(140px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#pz{right:12px;top:calc(8px + env(safe-area-inset-top,0px));width:42px;height:42px;font-size:18px}
#ov{position:absolute;inset:0;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px}#ov h2{font-size:26px}#ov p{margin:0}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes mv{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}@keyframes gl{50%{box-shadow:0 0 14px var(--btn)}}
#wm{position:relative;height:100px;border-radius:12px;overflow:hidden;margin-bottom:10px;background:linear-gradient(#ffd27a,#f0903a 62%,#b9652a);font-size:26px;direction:ltr}#wm::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22px;background:#c98a46;border-radius:50% 50% 0 0/100% 100% 0 0}#wm i{position:absolute;font-style:normal;animation:mv linear infinite;z-index:1}#wm b{position:absolute;right:16px;top:6px;font-size:36px;animation:bob 4s ease-in-out infinite}
.ic{animation:bob 2.6s ease-in-out infinite}.card.lk .ic{animation:none;filter:grayscale(1)}.card.cur{animation:gl 2s infinite}
</style></head><body>
<div id="top"></div><div id="main"></div>
<nav id="nav"><button data-t="map" onclick="tab('map')">⚔️ الغزو</button><button data-t="shop" onclick="tab('shop')">🛒 المتجر</button><button data-t="base" onclick="tab('base')">🏡 القاعدة</button></nav><div id="ts"></div>
<div id="g"><div id="st"></div><canvas id="cv"></canvas><button id="pz">⏸</button>
<div id="bts"><button id="bR">🔄</button><button id="bE">🍖</button><button id="bH"></button><button id="bF"></button></div><button id="bf">🏹</button><div id="ov"></div></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),D=Math.hypot,f=n=>n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n),WS=2400,BX=1200,BY=1200;
// اسم، ضرر، معدل، سرعة، ذخيرة، إعادة تعبئة، عملات، حديد، لون، عدد، انتشار، اختراق، نار
const WP=[["مقلاع",12,.45,560,10,1.1,0,0,"#b08a5a",1,.03,0,0],["قوس خشبي",20,.5,620,12,1.3,150,5,"#d9b26f",1,.02,0,0],["رماح الرمي",18,.8,520,9,1.6,350,10,"#e0d2a8",3,.24,0,0],["القوس المركب",30,.3,760,16,1.5,700,20,"#e8e0c0",1,.015,0,0],["النشاب",70,.9,900,6,1.8,1400,40,"#cfd6dc",1,.01,2,0],["قوس النار",45,.28,800,20,1.6,3000,80,"#ff8a2a",1,.02,0,1]];
const WI=['🪃','🏹','🔱','🏹','🎯','🔥'];
const AR=[["ثياب عادية",100,0,0,0,"#7a5c3a"],["درع جلدي",140,2,120,0,"#8a5a2b"],["درع حلقي",200,5,300,10,"#9aa4ad"],["درع صفائحي",300,9,800,30,"#c3ccd4"],["درع ملكي",450,14,1800,60,"#e8b84a"]];
const CT=[["مصر","🏺","جند الفراعنة","#c9a24a","#2a4a8a"],["ليبيا","🐪","الطوارق","#2a4a9a","#1a2a5a"],["قرطاج (تونس)","🐘","القرطاجيون","#7a2a6a","#c9a24a"],["الجزائر","🏜️","الأمازيغ","#8a6a3a","#2a6a3a"],["المغرب","🕌","المرابطون","#2a2a2a","#2a5a8a"],["مالي","👑","الماندينغ","#a8742a","#d9b21a"],["السنغال","🥁","الولوف","#3a8a4a","#e8c81a"],["نيجيريا","🗿","الهوسا","#2a6a8a","#e8e8e8"],["غانا","🏅","الأشانتي","#c9a21a","#8a1a1a"],["السودان","🔺","النوبيون","#7a3a1a","#e8b84a"],["الحبشة","🦁","الأمهرة","#2a7a3a","#d9b21a"],["الصومال","⛵","الصوماليون","#4a8ad9","#ffffff"],["كينيا","🦓","الماساي","#c22a2a","#1a1a1a"],["الكونغو","🌿","البانتو","#2a5a2a","#8a5a2a"],["زيمبابوي","🏯","الشونا","#5a4a3a","#c9a24a"],["مدغشقر","🦎","الملاغاشي","#2a8a8a","#8a2a6a"],["جنوب أفريقيا","🛡️","الزولو","#e8e0c8","#2a2a2a"]];
// n,hp,spd,r,dmg,ac,rng,c,c2,wi,arm
const ET=[{n:'لصاً',hp:30,spd:125,r:13,dmg:8,ac:.8,rng:22,c:'#8a3a2a',c2:'#3a2a22',wi:10,arm:0},{n:'رامياً',hp:28,spd:75,r:13,dmg:9,ac:1.7,rng:0,c:'#b89a4a',c2:'#6a5a2a',wi:11,arm:0},{n:'فارساً',hp:75,spd:200,r:17,dmg:16,ac:1.2,rng:26,c:'#6a4a2a',c2:'#2a4a8a',wi:12,arm:0},{n:'حارساً',hp:170,spd:60,r:18,dmg:20,ac:1.4,rng:30,c:'#566a5a',c2:'#aab',wi:13,arm:4},{n:'القائد',hp:900,spd:55,r:30,dmg:30,ac:1.5,rng:46,c:'#e8b84a',c2:'#8a1a1a',wi:14,arm:6}];
const S0=()=>({coins:100,food:30,wood:80,stone:30,iron:10,w:0,a:0,ow:[0],oa:[0],cq:[],H:[],F:[],sol:[0,0,0,0],wk:0});
let S,TB='map',G=null;try{S=Object.assign(S0(),JSON.parse(localStorage.getItem('mi2')||'{}'))}catch(e){S=S0()}
const save=()=>{try{localStorage.setItem('mi2',JSON.stringify(S))}catch(e){}};
const toast=t=>{const e=$('#ts');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1700)};
const BC=t=>{const n=S[t].length;return t=='H'?{wood:30+12*n,stone:10+6*n}:{wood:25+10*n}};
const RS={coins:"🪙",wood:"🪵",stone:"🪨",iron:"⛓️",food:"🌾"};
const chips=o=>Object.entries(o).map(([r,v])=>`<span class="chip ${S[r]<v?'x':''}">${RS[r]}${v}</span>`).join('');
function rTop(){$('#top').innerHTML=['coins','wood','stone','iron','food'].map(k=>`<span>${RS[k]} <b>${f(S[k])}</b></span>`).join('')+`<span>🏠 <b>${S.H.length}</b> 🌾 <b>${S.F.length}</b></span>`}
function tab(t){TB=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));render()}
function render(){rTop();$('#main').innerHTML=TB=='map'?rMap():TB=='shop'?rShop():rBase()}
function rMap(){return `<div id="wm"><b>☀️</b><i style="top:6px;animation-duration:40s">☁️</i><i style="top:30px;animation-duration:58s;animation-delay:-22s">☁️</i><i style="bottom:4px;animation-duration:24s">🐫🐫🐫</i><i style="bottom:4px;animation-duration:36s;animation-delay:-14s">🦒</i><i style="bottom:4px;animation-duration:52s;animation-delay:-32s">🐘🐘</i><i style="top:20px;animation-duration:30s;animation-delay:-9s">🦅</i></div><h2>🌍 خريطة أفريقيا — ${S.cq.length}/${CT.length} محتلة</h2><small style="color:var(--mut)">كل جولة تنجو منها تمنحك 100 عملة 🪙</small><br><br>`+CT.map((c,i)=>{const dn=S.cq.includes(i),op=i==0||S.cq.includes(i-1);return `<div class="card ${op?(dn?'':'cur'):'lk'}"><div class="ic">${c[1]}</div><div class="in"><b>${c[0]}</b><small>🪶 ${c[2]} · ${'⚔️'.repeat(Math.min(5,1+(i/3|0)))} قوة ×${(1+.4*i).toFixed(1)} · ${Math.min(3+(i>>1),7)} جولات</small><small>${dn?'✅ محتلة، تدر دخلاً':op?'الجائزة: '+(200+i*120)+' 🪙 + موارد':'🔒 احتل السابقة أولاً'}</small></div><button ${op?'':'disabled'} onclick="go(${i})">${dn?'أعد الغزو':'هاجم'}</button></div>`}).join('')}
function rShop(){const row=(t,L,ow,cur)=>L.map((x,i)=>{const o=ow.includes(i),eq=cur==i,cs=t=='w'?{coins:x[6],iron:x[7]}:{coins:x[3],iron:x[4]},info=t=='w'?`ضرر ${x[1]}${x[9]>1?'×'+x[9]:''} · ذخيرة ${x[4]}${x[12]?' · نار':''}${x[11]?' · اختراق':''}`:`صحة ${x[1]} · دفاع ${x[2]}`;return `<div class="card"><div class="ic">${t=='w'?WI[i]:['👕','🥋','⛓️','🛡️','👑'][i]}</div><div class="in"><b>${x[0]}</b><small>${info}</small>${o?'':'<div>'+chips(cs)+'</div>'}</div><button class="${eq?'alt':''}" onclick="${o?`eq('${t}',${i})`:`buy('${t}',${i})`}">${eq?'مجهّز':o?'جهّز':'شراء'}</button></div>`}).join('');return `<h2>🏹 الأسلحة</h2>`+row('w',WP,S.ow,S.w)+`<h2>🛡️ الدروع</h2>`+row('a',AR,S.oa,S.a)+rTr()}
const rBase=()=>`<h2>🏡 قاعدتك</h2><div id="scene">${'🏠'.repeat(S.H.length)||'⛺'}${'🌾'.repeat(S.F.length)}${'👷'.repeat(S.wk)}${'🪖'.repeat(S.sol.reduce((a,b)=>a+b,0))}</div><p style="font-size:14px">ادخل القاعدة واجمع الموارد برمي السهام على 🌳 الأشجار و🪨 الصخور و⛏️ الحديد و🫐 الشجيرات، ثم ابنِ: 🏠 منزلاً (+10 صحة وجندي رامٍ يرافقك ودخل عملات) و🌾 مزرعة (طعام للعلاج 🍖). الحد 12 من كل نوع.</p><button onclick="go(-1)">🏡 ادخل القاعدة</button><br><br><button class="alt" onclick="if(confirm('مسح كل التقدم؟')){S=S0();save();render()}">🗑️ إعادة اللعبة</button>`;
const SD=[['رامي القبيلة','🏹',120,20,60,10,170,0,'يرمي من بعيد',1,'#a8743a','#e8d9a0'],['محارب الرمح','🔱',200,30,150,16,150,26,'مقاتل قريب سريع',12,'#8a3a2a','#e8d9a0'],['فارس الجمّال','🐫',450,60,110,24,230,28,'سريع جداً وضربته قوية',2,'#c9a24a','#2a4a9a'],['حارس الدرع','🛡️',600,80,320,12,120,26,'يتحمل الضرب ويحمي القاعدة',13,'#3a3a3a','#c22a2a']];
function rTr(){return `<h2>🪖 الجنود</h2>`+SD.map((x,i)=>`<div class="card"><div class="ic">${x[1]}</div><div class="in"><b>${x[0]} <small>×${S.sol[i]}/5</small></b><small>${x[8]} · صحة ${x[4]} · ضرر ${x[5]}</small><div>${chips({coins:x[2],food:x[3]})}</div></div><button onclick="hire(${i})">تجنيد</button></div>`).join('')+`<h2>👷 العمال</h2><div class="card"><div class="ic">👷</div><div class="in"><b>عمال الحقول والمناجم <small>×${S.wk}/10</small></b><small>يقطعون ويحفرون ويجمعون الموارد بأنفسهم</small><div>${chips({coins:80+S.wk*30,food:15})}</div></div><button onclick="hire(-1)">توظيف</button></div>`}
function hire(i){const x=i<0?null:SD[i],cs=i<0?{coins:80+S.wk*30,food:15}:{coins:x[2],food:x[3]};if(i<0?S.wk>=10:S.sol[i]>=5)return toast('وصلت للحد الأقصى');for(const r in cs)if(S[r]<cs[r])return toast('موارد غير كافية');for(const r in cs)S[r]-=cs[r];i<0?S.wk++:S.sol[i]++;save();render()}
function buy(t,i){const x=t=='w'?WP[i]:AR[i],cc=t=='w'?x[6]:x[3],ir=t=='w'?x[7]:x[4];if(S.coins<cc||S.iron<ir)return toast('عملات أو حديد غير كافٍ');S.coins-=cc;S.iron-=ir;(t=='w'?S.ow:S.oa).push(i);eq(t,i)}
function eq(t,i){S[t]=i;save();render()}
setInterval(()=>{const n=S.cq.length;S.coins+=S.H.length*.4+n*2;S.food+=S.F.length*1.5+S.wk*.15;S.wood+=.3*n+S.wk*.2;S.stone+=.2*n+S.wk*.1;S.iron+=.1*n+S.wk*.04;rTop()},1000);setInterval(save,5000);
// ================= اللعبة =================
const cv=$('#cv'),c=cv.getContext('2d'),K={},ptr={};let W,H,sc,dpr,ST=0,pat,vg;
const near=(o,a,m=1e9)=>{let b=null,d=m;for(const e of a){const k=D(e.x-o.x,e.y-o.y);if(k<d){d=k;b=e}}return b};
function circ(x,y,r,col){if(col)c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;sc=Math.min(W,H)/440;ST=$('#st').offsetHeight;vg=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'#0000');vg.addColorStop(1,'#000a')}
addEventListener('resize',rs);
(()=>{const t=document.createElement('canvas');t.width=t.height=256;const x=t.getContext('2d');x.fillStyle='#9a8f4a';x.fillRect(0,0,256,256);for(let i=0;i<70;i++){x.fillStyle=`hsla(${R(38,78)},45%,${R(34,48)}%,.35)`;x.beginPath();x.ellipse(R(0,256),R(0,256),R(14,40),R(10,30),R(0,3),0,7);x.fill()}
for(let i=0;i<1400;i++){x.strokeStyle=`hsl(${R(45,95)},45%,${R(30,55)}%)`;x.lineWidth=1.2;const a=R(0,256),b=R(0,256);x.beginPath();x.moveTo(a,b);x.lineTo(a+R(-2,2),b-R(3,7));x.stroke()}pat=c.createPattern(t,'repeat')})();
function go(i){$('#ov').style.display='none';if(!G){$('#g').style.display='block';rs()}
const a=AR[S.a],mh=a[1]+S.H.length*10,nd=[],mk=(k,n,r,hp,res,nn)=>{for(let j=0;j<n;j++){let x,y;do{x=R(80,WS-80);y=R(80,WS-80)}while(D(x-BX,y-BY)<150);nd.push({k,x,y,r:r*R(.85,1.2),hp,mhp:hp,res,n:nn,dead:0,rt:0,sh:0,pr:Array.from({length:7},()=>R(.8,1.15))})}};
mk('t',48,26,3,'wood',4);mk('r',26,22,4,'stone',3);mk('i',14,20,5,'iron',2);mk('b',18,16,2,'food',5);mk('g',9,20,6,'coins',6);
const dc=Array.from({length:260},()=>({x:R(0,WS),y:R(0,WS),c:['#e8d34a','#fff','#d66ac0','#8fd'][R(0,4)|0],s:R(1,2.3)}));
G={i,s:1+.4*i,base:i<0,wave:0,waves:Math.min(3+(i>>1),7),t:0,e:[],al:[],pr:[],it:[],nd,dc,pt:[],tx:[],kf:[],q:[],ph:'rest',rest:5,sd:0,gain:0,kills:0,lost:0,done:0,shake:0,ann:2.5,msg:0,fb:0,rq:0,pause:0,cam:{x:BX,y:BY+80},
p:{x:BX,y:BY+90,a:-1.57,r:14,hp:mh,mhp:mh,am:WP[S.w][4],rl:0,cd:0,hit:0,inv:0,t:0,mv:0,rc:0}};
const n=Math.min(S.H.length,6);for(let k=0;k<n;k++)G.al.push({x:BX-40+k*16,y:BY+120,a:0,r:12,hp:60,mhp:60,cd:R(0,1),t:0,hit:0,mv:0,d:6+S.w*4});
SD.forEach((x,t)=>{for(let k=0;k<S.sol[t];k++)G.al.push({x:BX-90+k*20,y:BY+150+t*16,a:0,r:t==3?15:12,hp:x[4],mhp:x[4],cd:R(0,1),t:0,hit:0,mv:0,d:x[5]+S.w*2,sp:x[6],rng:x[7],wi:x[9],c:x[10],c2:x[11]})});
const tr=Math.min(6,S.cq.length>>1);for(let k=0;k<tr;k++){const q=CT[S.cq[k%S.cq.length]];G.al.push({x:BX+60+k*18,y:BY+150,a:0,r:12,hp:130,mhp:130,cd:R(0,1),t:0,hit:0,mv:0,d:14,sp:150,rng:26,wi:12,c:q[3],c2:q[4]})}
