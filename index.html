<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7e0d0d"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>ممالك الحديد</title><meta name="color-scheme" content="light dark">

<style>
:root{--bg:#f3e9d6;--card:#fff8e8;--ink:#2b1d12;--mut:#7a6648;--line:#d8c6a0;--gold:#b45f06;--btn:#e8590c;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14100d;--card:#241b15;--ink:#f3e6cf;--mut:#a89270;--line:#45342a;--gold:#ffb020;--btn:#f0600c;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14100d;--card:#241b15;--ink:#f3e6cf;--mut:#a89270;--line:#45342a;--gold:#ffb020;--btn:#f0600c;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#top{display:flex;flex-wrap:wrap;gap:4px 10px;padding:8px 10px;background:var(--card);border-bottom:3px solid var(--btn);font-size:14px;justify-content:center}#top b{color:var(--gold)}
#main{flex:1;overflow:auto;padding:10px;max-width:640px;width:100%;margin:0 auto}h2{margin:6px 0 10px;font-size:18px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--btn);border-radius:10px;padding:10px;margin-bottom:8px}.card.lk{opacity:.5}
.ic{font-size:30px;width:42px;text-align:center}.in{flex:1;display:flex;flex-direction:column;gap:2px}.in small{color:var(--mut);font-size:12px}
button{font-family:inherit;font-weight:900;background:var(--btn);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}button:disabled{opacity:.4}button.alt{background:var(--mut)}
.chip{display:inline-block;margin-inline-end:6px;font-size:12px}.chip.x{color:var(--bad)}
#scene{background:linear-gradient(var(--card),var(--line));border-radius:12px;padding:12px;margin-bottom:10px;font-size:28px;line-height:1.5;text-align:center;min-height:80px}
#nav{display:flex;border-top:2px solid var(--line);background:var(--card)}#nav button{flex:1;border-radius:0;background:none;color:var(--mut);padding:12px 4px}#nav button.on{color:var(--gold);box-shadow:inset 0 3px var(--btn)}
#ts{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#g{position:fixed;inset:0;background:#000;display:none;z-index:50;touch-action:none}#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#st{position:absolute;top:0;height:env(safe-area-inset-top,0px);visibility:hidden}
#g button{position:absolute;border-radius:50%;background:#0007;border:2px solid #fff8;color:#fff;padding:0;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#bf{right:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:96px;height:96px;font-size:40px;background:#e8590ccc;border-color:#ffd9a0}
#bts button,#bl button{position:static;width:48px;height:48px;font-size:20px}#bl{position:absolute;left:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:48px 48px;gap:8px}#g button small{font-size:8px;white-space:nowrap;margin-top:1px}
#bts{position:absolute;right:14px;bottom:calc(140px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#pz{right:12px;top:calc(8px + env(safe-area-inset-top,0px));width:42px;height:42px;font-size:18px}#bX{right:62px;top:calc(8px + env(safe-area-inset-top,0px));width:42px;height:42px;font-size:18px}
#ov{position:absolute;inset:0;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px}#ov h2{font-size:26px}#ov p{margin:0}#ov button{position:static;width:auto;height:auto;border-radius:10px;background:var(--btn);border:0;padding:11px 22px;font-size:16px;display:block;min-width:200px}#ov button.alt{background:var(--mut)}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes mv{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}@keyframes gl{50%{box-shadow:0 0 14px var(--btn)}}
#wm{position:relative;height:100px;border-radius:12px;overflow:hidden;margin-bottom:10px;background:linear-gradient(#ffd27a,#f0903a 62%,#b9652a);font-size:26px;direction:ltr}.sa,.sb{position:absolute;inset:0;transition:opacity 1.2s}.sb{opacity:0;background:linear-gradient(#ffd6e6,#f08aa0 62%,#7a3a5a)}#wm.as .sa{opacity:0}#wm.as .sb{opacity:1}.sa::after,.sb::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22px;background:#c98a46;border-radius:50% 50% 0 0/100% 100% 0 0}.sb::after{background:#5d8a3a}#wm i{position:absolute;font-style:normal;animation:mv linear infinite;z-index:1}#wm b{position:absolute;right:16px;top:6px;font-size:36px;animation:bob 4s ease-in-out infinite}
.ic{animation:bob 2.6s ease-in-out infinite}.card.lk .ic{animation:none;filter:grayscale(1)}.card.cur{animation:gl 2s infinite}
</style></head><body>
<div id="top"></div><div id="main"></div>
<nav id="nav"><button data-t="map" onclick="tab('map')">⚔️ الغزو</button><button data-t="shop" onclick="tab('shop')">🛒 المتجر</button><button data-t="base" onclick="tab('base')">🏡 القاعدة</button><button data-t="help" onclick="tab('help')">📖 شرح</button></nav><div id="ts"></div>
<div id="g"><div id="st"></div><canvas id="cv"></canvas><button id="pz">⏸</button><button id="bX">🚪</button>
<div id="bts"><button id="bH"></button><button id="bE">🍖</button><button id="bR">🔄</button></div><div id="bl"><button id="bF"></button><button id="bS">💥</button><button id="bT"></button></div><button id="bf">🏹</button><div id="ov"></div></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),D=Math.hypot,f=n=>n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n),WS=3600,BX=1800,BY=1800;
// اسم، ضرر، معدل، سرعة، ذخيرة، إعادة تعبئة، عملات، حديد، لون، عدد، انتشار، اختراق، نار
const WP=[["مقلاع",16,.45,560,14,1.1,0,0,"#b08a5a",1,.03,0,0],["قوس خشبي",20,.5,620,12,1.3,150,5,"#d9b26f",1,.02,0,0],["رماح الرمي",18,.8,520,9,1.6,350,10,"#e0d2a8",3,.24,0,0],["القوس المركب",30,.3,760,16,1.5,700,20,"#e8e0c0",1,.015,0,0],["النشاب",70,.9,900,6,1.8,1400,40,"#cfd6dc",1,.01,2,0],["قوس النار",45,.28,800,20,1.6,3000,80,"#ff8a2a",1,.02,0,1],["قوس التنين",90,.25,950,24,1.5,5500,120,"#ff4a4a",2,.03,1,1]];
const WI=['🪃','🏹','🔱','🏹','🎯','🔥','🐉'];
const AR=[["ثياب عادية",150,0,0,0,"#7a5c3a"],["درع جلدي",140,2,120,0,"#8a5a2b"],["درع حلقي",200,5,300,10,"#9aa4ad"],["درع صفائحي",300,9,800,30,"#c3ccd4"],["درع ملكي",450,14,1800,60,"#e8b84a"],["درع التنين",650,20,4000,100,"#ff6a3a"]];
const CT=[["مصر","🏺","جند الفراعنة","#c9a24a","#2a4a8a"],["ليبيا","🐪","الطوارق","#2a4a9a","#1a2a5a"],["قرطاج (تونس)","🐘","القرطاجيون","#7a2a6a","#c9a24a"],["الجزائر","🏜️","الأمازيغ","#8a6a3a","#2a6a3a"],["المغرب","🕌","المرابطون","#2a2a2a","#2a5a8a"],["مالي","👑","الماندينغ","#a8742a","#d9b21a"],["السنغال","🥁","الولوف","#3a8a4a","#e8c81a"],["نيجيريا","🗿","الهوسا","#2a6a8a","#e8e8e8"],["غانا","🏅","الأشانتي","#c9a21a","#8a1a1a"],["السودان","🔺","النوبيون","#7a3a1a","#e8b84a"],["الحبشة","🦁","الأمهرة","#2a7a3a","#d9b21a"],["الصومال","⛵","الصوماليون","#4a8ad9","#ffffff"],["كينيا","🦓","الماساي","#c22a2a","#1a1a1a"],["الكونغو","🌿","البانتو","#2a5a2a","#8a5a2a"],["زيمبابوي","🏯","الشونا","#5a4a3a","#c9a24a"],["مدغشقر","🦎","الملاغاشي","#2a8a8a","#8a2a6a"],["جنوب أفريقيا","🛡️","الزولو","#e8e0c8","#2a2a2a"],["الكاميرون","🥁","البامبيلكي","#b8431e","#2a6a3a"],["أوغندا","🦍","البوغندا","#4a3a2a","#e8b81a"],["رواندا","⛰️","التوتسي","#2a6a4a","#e8d9a0"],["تنزانيا","🌋","الماكوندي","#8a4a2a","#2a5a8a"],["موزمبيق","🌊","الماكوا","#2a7a9a","#e8c8a0"],["ناميبيا","🏜️","الهيريرو","#a82a5a","#e8d9a0"],["بوتسوانا","🐘","التسوانا","#5a6a8a","#d9b21a"],["ساحل العاج","🍫","الباولي","#7a4a1a","#2a8a3a"],["الهند","🐘","المراثا","#d9822a","#2a8a3a"],["الصين","🐉","الهان","#b82a2a","#e8b81a"],["اليابان","🗾","الساموراي","#2a2a4a","#c22a2a"],["بلاد فارس","🦁","الفرس","#2a5a9a","#e8d9a0"],["المغول","🐎","المغول","#6a4a2a","#2a6a8a"],["كوريا","🏯","الهوارانغ","#e8e8f0","#2a4a9a"],["تايلاند","🛕","التاي","#c9a21a","#8a2a6a"],["فيتنام","🌾","الفيت","#2a7a4a","#d9b21a"],["إندونيسيا","🌋","الجاويون","#8a2a2a","#e8d9a0"],["تركيا","🌙","العثمانيون","#a82a2a","#e8e8e8"]];
// n,hp,spd,r,dmg,ac,rng,c,c2,wi,arm
const ET=[{n:'لصاً',hp:30,spd:125,r:13,dmg:6,ac:1,rng:22,c:'#8a3a2a',c2:'#3a2a22',wi:10,arm:0},{n:'رامياً',hp:28,spd:75,r:13,dmg:6,ac:1.7,rng:0,c:'#b89a4a',c2:'#6a5a2a',wi:11,arm:0},{n:'فارساً',hp:75,spd:200,r:17,dmg:16,ac:1.2,rng:26,c:'#6a4a2a',c2:'#2a4a8a',wi:12,arm:0},{n:'حارساً',hp:170,spd:60,r:18,dmg:20,ac:1.4,rng:30,c:'#566a5a',c2:'#aab',wi:13,arm:4},{n:'القائد',hp:340,spd:55,r:30,dmg:22,ac:1.5,rng:46,c:'#e8b84a',c2:'#8a1a1a',wi:14,arm:3}];
const S0=()=>({coins:300,food:40,wood:80,stone:30,iron:20,w:0,a:0,ow:[0],oa:[0],cq:[],H:[],F:[],sol:[0,0,0,0,0],wk:0,P:[],T:[],D:[],pw:0,pwo:[0],up:[0,0,0,0,0,0,0],dg:'',st:0,ach:{},kt:0,tut:0,mute:0,mm:0});
let S,TB='map',G=null;try{S=Object.assign(S0(),JSON.parse(localStorage.getItem('mi2')||'{}'))}catch(e){S=S0()}
if(S.v!=2){for(const b of [...S.H,...S.F]){b.x+=600;b.y+=600}S.v=2}
const save=()=>{try{localStorage.setItem('mi2',JSON.stringify(S))}catch(e){}};
const toast=t=>{const e=$('#ts');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1700)};
const BC=t=>{const n=S[t].length;return t=='H'?{wood:30+12*n,stone:10+6*n}:t=='P'?{wood:150+60*n,stone:120+50*n,iron:20+10*n}:t=='T'?{wood:60+15*n,stone:50+12*n,iron:8}:{wood:25+10*n}};
const RS={coins:"🪙",wood:"🪵",stone:"🪨",iron:"⛓️",food:"🌾"};
const chips=o=>Object.entries(o).map(([r,v])=>`<span class="chip ${S[r]<v?'x':''}">${RS[r]}${v}</span>`).join('');
function rTop(){$('#top').innerHTML=['coins','wood','stone','iron','food'].map(k=>`<span>${RS[k]} <b>${f(S[k])}</b></span>`).join('')+`<span>🏠 <b>${S.H.length}</b> 🌾 <b>${S.F.length}</b></span>`}
function tab(t){TB=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));render()}
function render(){rTop();$('#main').innerHTML=TB=='map'?rMap():TB=='shop'?rShop():TB=='help'?rHelp():rBase()}
function rMap(){return `<div id="wm"><div class="sa"><b>☀️</b><i style="top:6px;animation-duration:40s">☁️</i><i style="top:30px;animation-duration:58s;animation-delay:-22s">☁️</i><i style="bottom:4px;animation-duration:24s">🐫🐫</i><i style="bottom:4px;animation-duration:36s;animation-delay:-14s">🦒</i><i style="bottom:4px;animation-duration:52s;animation-delay:-32s">🐘</i><i style="top:20px;animation-duration:30s;animation-delay:-9s">🦅</i><b style="right:auto;left:14px;top:auto;bottom:16px;font-size:44px;animation-duration:5s">🌴</b></div><div class="sb"><b>🌸</b><i style="top:8px;animation-duration:44s">☁️</i><i style="bottom:6px;animation-duration:14s">🐅</i><i style="bottom:6px;animation-duration:40s;animation-delay:-16s">🐼</i><i style="bottom:6px;animation-duration:50s;animation-delay:-28s">🐘</i><i style="top:26px;animation-duration:26s;animation-delay:-8s">🦢</i><b style="right:auto;left:14px;top:auto;bottom:12px;font-size:36px;animation-duration:5s">🎋</b><b style="right:auto;left:70px;top:auto;bottom:12px;font-size:34px;animation-duration:6s">🏯</b></div></div><h2>🌍 خريطة العالم — ${S.cq.length}/${CT.length} محتلة</h2>${giftBtn()}<small style="color:var(--mut)">كل جولة تنجو منها تمنحك 100 عملة 🪙</small><br><br>`+CT.map((c,i)=>{const dn=S.cq.includes(i),op=i==0||S.cq.includes(i-1);return `${i==0?'<h2>🌍 أفريقيا</h2>':i==25?'<h2>🌏 آسيا</h2>':''}<div class="card ${op?(dn?'':'cur'):'lk'}"><div class="ic">${c[1]}</div><div class="in"><b>${i+1}. ${c[0]}</b><small>🪶 ${c[2]}${i%4?' · '+MODN[i%4]:''} · ${'⚔️'.repeat(Math.min(5,1+(i/3|0)))} قوة ×${(1+.4*i).toFixed(1)} · ${Math.min(2+(i>>4),3)} جولات</small><small>${dn?'✅ محتلة، تدر دخلاً':op?'الجائزة: '+(200+i*120)+' 🪙 + موارد':'🔒 احتل السابقة أولاً'}</small></div><button ${op?'':'disabled'} onclick="go(${i})">${dn?'أعد الغزو':'هاجم'}</button></div>`}).join('')}
function rShop(){const row=(t,L,ow,cur)=>L.map((x,i)=>{const o=ow.includes(i),eq=cur==i,cs=t=='w'?{coins:x[6],iron:x[7]}:{coins:x[3],iron:x[4]},info=t=='w'?`ضرر ${x[1]}${x[9]>1?'×'+x[9]:''} · ذخيرة ${x[4]}${x[12]?' · نار':''}${x[11]?' · اختراق':''}`:`صحة ${x[1]} · دفاع ${x[2]}`;return `<div class="card"><div class="ic">${t=='w'?WI[i]:['👕','🥋','⛓️','🛡️','👑','🐲'][i]}</div><div class="in"><b>${x[0]}</b><small>${info}</small>${o?'':'<div>'+chips(cs)+'</div>'}</div><button class="${eq?'alt':''}" onclick="${o?`eq('${t}',${i})`:`buy('${t}',${i})`}">${eq?'مجهّز':o?'جهّز':'شراء'}</button></div>`}).join('');return `<h2>🏹 الأسلحة</h2>`+row('w',WP,S.ow,S.w)+`<h2>🛡️ الدروع</h2>`+row('a',AR,S.oa,S.a)+rPw()+rDef()+rUp()+rTr()}
const rBase=()=>`<h2>🏡 قاعدتك</h2><div id="scene">${'🏠'.repeat(S.H.length)||'⛺'}${'🌾'.repeat(S.F.length)}${'👷'.repeat(S.wk)}${'🪖'.repeat(S.sol.reduce((a,b)=>a+b,0))}</div><p style="font-size:14px">ادخل القاعدة واجمع الموارد برمي السهام على 🌳 الأشجار و🪨 الصخور و⛏️ الحديد و🫐 الشجيرات، ثم ابنِ: 🏠 منزلاً (+10 صحة وجندي رامٍ يرافقك ودخل عملات) و🌾 مزرعة (طعام للعلاج 🍖). الحد 12 من كل نوع.</p><button onclick="go(-1)">🏡 ادخل القاعدة</button> <button onclick="go(Math.min(S.cq.length,CT.length-1),1)">🛡️ دافع عن القرية</button> <button class="alt" onclick="S.mute=!S.mute;save();render()">${S.mute?'🔇 المؤثرات':'🔊 المؤثرات'}</button> <button class="alt" onclick="S.mm=!S.mm;save();render()">${S.mm?'🔕 الموسيقى':'🎵 الموسيقى'}</button>${rAch()}<br><br><button class="alt" onclick="if(confirm('مسح كل التقدم؟')){S=S0();save();render()}">🗑️ إعادة اللعبة</button>`;
const PWR=[['ضربة الأرض','🌋',0,0,8,'موجة تدمّر الأعداء حولك وتبعدهم'],['عاصفة السهام','🌪️',500,0,9,'16 سهماً في كل الاتجاهات'],['درع الحماية','🔰',700,15,14,'حصانة 5 ثوانٍ ويشفيك 20%'],['جنون الحرب','🔥',1000,25,15,'ضرر أقوى ورمي أسرع 7 ثوانٍ'],['نداء القبيلة','📯',1500,40,20,'يستدعي 4 محاربين أقوياء']];
function rPw(){return `<h2>⚡ القوى (زر 💥)</h2>`+PWR.map((x,i)=>{const o=S.pwo.includes(i),e=S.pw==i;return `<div class="card"><div class="ic">${x[1]}</div><div class="in"><b>${x[0]}</b><small>${x[5]} · انتظار ${x[4]}ث</small>${o?'':'<div>'+chips({coins:x[2],iron:x[3]})+'</div>'}</div><button class="${e?'alt':''}" onclick="${o?`eqP(${i})`:`buyP(${i})`}">${e?'مجهّز':o?'جهّز':'شراء'}</button></div>`}).join('')}
function buyP(i){const x=PWR[i];if(S.coins<x[2]||S.iron<x[3])return toast('عملات أو حديد غير كافٍ');S.coins-=x[2];S.iron-=x[3];S.pwo.push(i);eqP(i)}
